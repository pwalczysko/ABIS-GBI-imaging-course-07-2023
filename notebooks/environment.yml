name: abis_gbi_course_2023
channels:
  - bioconda
  - conda-forge
  - defaults
  - ome
dependencies:
  - python==3.12.*
  - numpy==2.4.4
  - pandas==3.0.2
  - scikit-image==0.26.0
  - conda-forge::zeroc-ice==3.6.5
  - pip
  - pip:
    - intermine==1.13.0
    - ipywidgets<8  # required for display. Remove if you are not using notebook
    - omero-py==5.22.1
    - matplotlib==3.10.8
    - jupyter==1.0.0 # if using notebooks. This can be omitted if using the script
